services:
  reporting-api:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - ./backend/data:/app/data
      - ./backend/generated_reports:/app/generated_reports
  reporting-ui:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5174:5174"]
    depends_on: [reporting-api]
